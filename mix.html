<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020">
<title>Beako MIX</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#090d1b;color:#f4f6ff;--panel:#11182b;--line:#293452;--muted:#8e9bb9;--accent:#8768f5;--green:#57d6a0;--red:#ff8291}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,rgba(87,68,170,.19),transparent 48%),linear-gradient(145deg,#080b18,#101832);padding:26px 14px}
.wrap{width:min(760px,100%);margin:0 auto}.top{display:flex;justify-content:flex-end;align-items:center;margin-bottom:28px}.top a{color:#cbd2ed;text-decoration:none;border:1px solid var(--line);padding:8px 12px;font-size:12px}.top a:hover{border-color:#8572df;color:white}
.hero{text-align:center;margin:0 0 24px}.hero h1{font-size:clamp(30px,5vw,42px);letter-spacing:-.05em;margin:0;font-weight:850}
.panel{background:rgba(17,24,43,.88);border:1px solid var(--line);padding:20px;margin:0 0 14px;box-shadow:0 16px 44px rgba(0,0,0,.2)}
.queue-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.queue-head h2{font-size:15px;margin:0;font-weight:750}.count{font-size:23px;font-weight:900;color:#c2b6ff;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#080d1b;overflow:hidden;margin:12px 0 15px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7357e8,#b49cff);transition:width .2s}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.player{background:#0c1325;border:1px solid #222e4b;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0;font-size:12px}.player span{overflow-wrap:anywhere}.player small{color:var(--muted);font-size:10px;overflow-wrap:anywhere;text-align:right}.note{color:var(--muted);font-size:12px;margin:0}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.fields label,.captain label{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.fields input,.captain input,.captain select{width:100%;background:#090f20;border:1px solid #303d5d;padding:12px;color:white;font:13px inherit;outline:none;border-radius:0}.fields input:focus,.captain input:focus,.captain select:focus{border-color:#927cff}
.actions{display:flex;gap:8px;margin-top:10px}.btn{border:1px solid transparent;padding:11px 15px;font-weight:750;font-size:12px;cursor:pointer;color:white;background:var(--accent)}.btn.secondary{background:#202b44;border-color:#344363}.btn:disabled{opacity:.4;cursor:not-allowed}.status{font-size:11px;min-height:15px;margin-top:10px;color:var(--muted)}.error{color:var(--red)}.success{color:var(--green)}.hidden{display:none!important}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:10px}.team{background:#0c1325;border:1px solid #222e4b;padding:12px}.team h3{font-size:12px;color:#c8bcff;margin:0 0 8px}.team p{font-size:12px;margin:6px 0}.captain{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.captain-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:600px){body{padding:18px 11px}.panel{padding:15px}.fields,.players,.teams,.captain-grid{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}.top{margin-bottom:20px}}
</style></head>
<body><main class="wrap">
<header class="top"><a href="/">← Főoldal</a></header>
<section class="hero"><h1>MIX</h1></section>
<section class="panel"><div class="queue-head"><h2>Várólista</h2><div class="count" id="count">0 / 10</div></div><div class="bar"><i id="progress"></i></div>
<div id="queuePlayers" class="players"><p class="note">Betöltés…</p></div>
<div id="joinForm"><div class="fields"><div><label for="steamId">Steam64ID</label><input id="steamId" inputmode="numeric" autocomplete="off" maxlength="17" placeholder="Steam64ID" required></div><div><label for="playerName">Játékosnév</label><input id="playerName" autocomplete="off" maxlength="24" placeholder="Játékosnév" required></div></div><div class="actions"><button class="btn" id="join">Csatlakozás</button><button class="btn secondary" id="leave">Kilépés</button></div></div>
<div class="status" id="message" aria-live="polite"></div></section>
<section class="panel hidden" id="draftPanel"><div class="queue-head"><h2>Csapatdraft</h2></div><p class="note" id="draftInfo"></p><div class="teams" style="margin-top:12px"><div class="team"><h3>1. CSAPAT</h3><div id="team0"></div></div><div class="team"><h3>2. CSAPAT</h3><div id="team1"></div></div></div><div class="captain"><div class="captain-grid"><div><label for="captainId">Kapitány Steam64ID</label><input id="captainId" inputmode="numeric" placeholder="Steam64ID"></div><div><label for="pickPlayer">Játékos</label><select id="pickPlayer"><option value="">Válassz…</option></select></div></div><button class="btn" id="pick" style="margin-top:9px">Kiválasztás</button></div></section>
<section class="panel hidden" id="nextPanel"><h2 style="font-size:14px;margin:0">Csapatok elkészültek</h2></section>
</main>
<script>
// A MIX oldal és az API ugyanazon a domainen, a Cloudflare Worker mögött fut.
// A form mezőinek tartalma NEM kerül elküldésre oldalbetöltéskor vagy frissítéskor.
const API = '/mix';
const $ = id => document.getElementById(id);
let current = null;
let submitting = false;
async function request(path, body) {
  if (!API) throw new Error('A MIX API HTTPS címe még nincs beállítva.');
  const options = { method: body ? 'POST' : 'GET', cache: 'no-store' };
  if (body) { options.headers = { 'Content-Type': 'application/json' }; options.body = JSON.stringify(body); }
  const response = await fetch(`${API}/api/mix${path}`, options);
  const raw = await response.text();
  let data;
  try { data = JSON.parse(raw); }
  catch { throw new Error(`A MIX API nem JSON választ adott (HTTP ${response.status}).`); }
  if (!response.ok || data.error) throw new Error(data.error || `HTTP ${response.status}`);
  return data.state || data;
}
function render(state) {
  current = state;
  $('count').textContent = `${state.queueCount} / ${state.maxPlayers}`;
  $('progress').style.width = `${state.queueCount / state.maxPlayers * 100}%`;
  $('queuePlayers').replaceChildren();
  for (const player of state.queue) {
    const el = document.createElement('div'); el.className = 'player';
    const name = document.createElement('span'); name.textContent = player.name;
    const id = document.createElement('small'); id.textContent = player.steamId;
    el.append(name, id); $('queuePlayers').append(el);
  }
  if (!state.queue.length) $('queuePlayers').innerHTML = '<p class="note">Üres várólista</p>';
  $('joinForm').classList.toggle('hidden', state.phase !== 'queue');
  $('draftPanel').classList.toggle('hidden', !state.match || !['draft','veto_pending'].includes(state.phase));
  $('nextPanel').classList.toggle('hidden', state.phase !== 'veto_pending');
  if (state.match) {
    const match = state.match;
    $('draftInfo').textContent = match.phase === 'draft' ? `Következő: ${match.captains[match.currentCaptain].name} · ${match.remaining.length} választható` : 'A draft befejeződött.';
    for (let team = 0; team < 2; team++) {
      $(`team${team}`).replaceChildren();
      for (const player of match.teams[team]) { const line = document.createElement('p'); line.textContent = player.name; $(`team${team}`).append(line); }
    }
    $('pickPlayer').innerHTML = '<option value="">Válassz…</option>';
    for (const player of match.remaining) { const option = document.createElement('option'); option.value = player.steamId; option.textContent = player.name; $('pickPlayer').append(option); }
    $('pick').disabled = match.phase !== 'draft' || !match.remaining.length;
  }
}
async function refresh() {
  try { render(await request('', null)); if (!$('message').classList.contains('error')) $('message').textContent = ''; }
  catch (error) { $('message').textContent = error.message; $('message').className = 'status error'; }
}
function message(text, ok = false) { $('message').textContent = text; $('message').className = 'status ' + (ok ? 'success' : 'error'); }
$('join').addEventListener('click', async () => {
  // Ez az egyetlen hely, ahol a böngésző a beírt Steam64ID-t és nevet elküldi a Beakónak.
  if (submitting) return;
  const steamId = $('steamId').value.trim();
  const name = $('playerName').value.normalize('NFKC').trim().replace(/\s+/gu, ' ');
  if (!/^\d{17}$/.test(steamId)) return message('A Steam64ID pontosan 17 számjegyből álljon.');
  if (name.length < 2 || name.length > 24) return message('A játékosnév 2–24 karakter legyen.');
  submitting = true; $('join').disabled = true;
  try {
    const state = await request('/join', { steamId, name });
    render(state); message('Sikeresen csatlakoztál a MIX várólistához.', true);
  } catch (error) { message(error.message); }
  finally { submitting = false; $('join').disabled = false; }
});
$('leave').addEventListener('click', async () => {
  const steamId = $('steamId').value.trim();
  if (!/^\d{17}$/.test(steamId)) return message('A kilépéshez add meg a 17 számjegyű Steam64ID-t.');
  try { render(await request('/leave', { steamId })); message('Kiléptél a várólistából.', true); }
  catch (error) { message(error.message); }
});
$('pick').addEventListener('click', async () => {
  try { render(await request('/pick', { captainSteamId: $('captainId').value.trim(), playerSteamId: $('pickPlayer').value })); message('Játékos kiválasztva.', true); }
  catch (error) { message(error.message); }
});
// Ez csak a nyilvános várólista állapotát kéri le; a beírt mezőkhöz nem nyúl és azokat nem küldi el.
refresh();
setInterval(refresh, 5000);
</script></body></html>
