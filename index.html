<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171923">
<title>Beako · CS2 szerverek</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#171923;color:#f4f5fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top,#292d42 0,#171923 62%)}main{width:min(100%,560px);padding:24px;background:#222532;border:1px solid #3a3f53;border-radius:18px;box-shadow:0 20px 70px #0005}.brand{font-size:12px;font-weight:800;letter-spacing:.07em;color:#cbd3ff}.servers{display:grid;gap:12px;margin-top:20px}.extras{margin-top:16px;padding:15px;border:1px solid #41465d;border-radius:13px;background:#292d3d}.extras p{color:#c6c9d8;font-size:13px;line-height:1.5;margin:6px 0 12px}.extras a{background:#a34bdb}.extras a:hover{background:#b86be8}.server{padding:17px;border:1px solid #41465d;border-radius:13px;background:#292d3d}.server.active{border-color:#6478ff;box-shadow:0 0 0 1px #6478ff55}h1{font-size:25px;margin:10px 0 0}h2{font-size:17px;margin:0 0 10px}.address{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;color:#dce1ff;overflow-wrap:anywhere;margin:0 0 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}a,button{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:10px 13px;border:0;border-radius:9px;font-size:13px;font-weight:750;text-decoration:none;cursor:pointer}a{background:#6478ff;color:white}a:hover{background:#7889ff}button{background:#3b4054;color:#f3f4fb}button:hover{background:#4b516a}#status{min-height:18px;color:#aeb8ff;font-size:12px;margin:14px 0 0}@media(max-width:420px){main{padding:17px}.actions>*{flex:1}}
</style>
</head>
<body><main>
<div class="brand">BEAKO MANAGER · CS2</div>
<h1>Szerverek</h1>
<div class="servers">
<section class="server" id="mainCard">
<h2>Fő szerver</h2><p class="address" id="mainAddress">212.73.137.7:27914</p>
<div class="actions"><a id="mainConnect" href="steam://connect/212.73.137.7:27914">Csatlakozás</a><button id="mainCopy" type="button">IP másolása</button></div>
</section>
<section class="server" id="secondaryCard">
<h2>Másodlagos szerver</h2><p class="address" id="secondaryAddress">212.73.137.40:27381</p>
<div class="actions"><a id="secondaryConnect" href="steam://connect/212.73.137.40:27381">Csatlakozás</a><button id="secondaryCopy" type="button">IP másolása</button></div>
</section>
</div>
<section class="extras">
<h2>Skinek beállítása</h2>
<p>A CS2 Inventory Simulator oldalán állíthatod be a skineket, majd a szervereden használhatod őket.</p>
<div class="actions"><a href="https://inventory.cstrike.app/" target="_blank" rel="noopener noreferrer">Inventory Simulator megnyitása ↗</a></div>
</section>
<p id="status" aria-live="polite"></p>
</main>
<script>
(()=>{
 const q=new URLSearchParams(location.search);
 const selected=(q.get('server')||'main').toLowerCase()==='secondary'?'secondary':'main';
 const validIp=x=>/^(?:\d{1,3}\.){3}\d{1,3}$/.test(x)&&x.split('.').every(n=>+n>=0&&+n<=255);
 const validPort=x=>/^\d+$/.test(x)&&Number(x)>0&&Number(x)<=65535;
 let ip=q.get('ip')||'';let port=q.get('port')||'';
 if(!validIp(ip))ip=selected==='secondary'?'212.73.137.40':'212.73.137.7';
 if(!validPort(port))port=selected==='secondary'?'27381':'27914';
 const password=q.get('password')||'kurvaanyatokrandomok';
 const servers={main:{address:'212.73.137.7:27914',url:'steam://connect/212.73.137.7:27914'},secondary:{address:'212.73.137.40:27381',url:'steam://connect/212.73.137.40:27381'}};
 servers[selected]={address:`${ip}:${port}`,url:`steam://connect/${ip}:${port}`+(password?`/${encodeURIComponent(password)}`:'')};
 for(const key of ['main','secondary']){
  document.getElementById(key+'Address').textContent=servers[key].address;
  document.getElementById(key+'Connect').href=servers[key].url;
  document.getElementById(key+'Card').classList.toggle('active',key===selected);
  document.getElementById(key+'Copy').addEventListener('click',async()=>{
   const text=`connect ${servers[key].address}; password ${password}`;const status=document.getElementById('status');
   try{await navigator.clipboard.writeText(text);status.textContent='Kimásolva, konzolba illeszthető parancs: '+text}
   catch{const field=document.createElement('textarea');field.value=text;document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();status.textContent=ok?'Kimásolva, konzolba illeszthető parancs: '+text:'Másold ki ezt: '+text}
  });
 }
 document.title=`${selected==='secondary'?'Másodlagos':'Fő'} CS2 szerver · Beako`;
})();
</script></body></html>
