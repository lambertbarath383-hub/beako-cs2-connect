<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171923">
<title>Beako · CS2 csatlakozás</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#171923;color:#f4f5fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at top,#292d42 0,#171923 62%)}main{width:min(100%,470px);padding:23px;background:#222532;border:1px solid #3a3f53;border-radius:17px;box-shadow:0 20px 70px #0005}.brand{font-size:11px;font-weight:800;letter-spacing:.08em;color:#cbd3ff}h1{font-size:23px;margin:13px 0 7px}.hint{color:#b9c0d7;font-size:13px;line-height:1.5;margin:0 0 18px}.server{padding:16px;border:1px solid #41465d;border-radius:12px;background:#292d3d}.address{font:14px ui-monospace,SFMono-Regular,Consolas,monospace;color:#dce1ff;overflow-wrap:anywhere;margin:0 0 13px}.actions{display:flex;gap:8px;flex-wrap:wrap}a,button{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:11px 14px;border:0;border-radius:9px;font-size:13px;font-weight:750;text-decoration:none;cursor:pointer}a{background:#6478ff;color:white;flex:1}a:hover{background:#7889ff}button{background:#3b4054;color:#f3f4fb}button:hover{background:#4b516a}#status{min-height:18px;color:#aeb8ff;font-size:12px;line-height:1.45;margin:13px 0 0}.small{font-size:11px;color:#8992ad;margin:13px 0 0}
</style>
</head>
<body><main>
<div class="brand">BEAKO MANAGER · CS2</div>
<h1 id="heading">Csatlakozás a szerverhez</h1>
<p class="hint">Kattints a csatlakozásra a Steam megnyitásához, vagy másold ki a konzolparancsot.</p>
<section class="server">
<p class="address" id="address">212.73.137.7:27914</p>
<div class="actions"><a id="connect" href="steam://connect/212.73.137.7:27914">Csatlakozás a Steamen</a><button id="copy" type="button">Parancs másolása</button></div>
<p id="status" aria-live="polite"></p>
</section>
<p class="small">Ha a Steam megnyílt, ezt a lapot bezárhatod. A böngészők biztonsági okból nem mindig engedik az automatikus bezárást.</p>
</main>
<script>
(()=>{
 const q=new URLSearchParams(location.search);
 const selected=(q.get('server')||'main').toLowerCase()==='secondary'?'secondary':'main';
 const defaults={main:{ip:'212.73.137.7',port:'27914',label:'Fő CS2-szerver'},secondary:{ip:'212.73.137.40',port:'27381',label:'Másodlagos CS2-szerver'}};
 const validIp=x=>/^(?:\d{1,3}\.){3}\d{1,3}$/.test(x)&&x.split('.').every(n=>+n>=0&&+n<=255);
 const validPort=x=>/^\d+$/.test(x)&&Number(x)>0&&Number(x)<=65535;
 const d=defaults[selected]; let ip=(q.get('ip')||'').trim(); let port=(q.get('port')||'').trim();
 if(!validIp(ip))ip=d.ip;if(!validPort(port))port=d.port;
 const password=q.get('password')||''; const address=`${ip}:${port}`;
 const steamUrl=`steam://connect/${address}`+(password?`/${encodeURIComponent(password)}`:'');
 const quoteSafe=password.replace(/\\/g,'\\\\').replace(/"/g,'\\"');
 const command=(password?`password "${quoteSafe}"; `:'')+`connect ${address}`;
 document.title=`${d.label} · Beako`;
 document.getElementById('heading').textContent=`Csatlakozás: ${d.label}`;
 document.getElementById('address').textContent=address;
 const link=document.getElementById('connect'); link.href=steamUrl;
 link.addEventListener('click',()=>{
   document.getElementById('status').textContent='Steam-csatlakozás megnyitása…';
   // A böngésző csak a script által megnyitott ablak bezárását engedélyezi megbízhatóan.
   // Megpróbáljuk bezárni, de ha a böngésző blokkolja, a lap kézzel bezárható.
   setTimeout(()=>{ try { window.close(); } catch (_) {} }, 1200);
 });
 document.getElementById('copy').addEventListener('click',async()=>{
   const status=document.getElementById('status');
   try { await navigator.clipboard.writeText(command); status.textContent='Kimásolva a CS2 konzolparancs jelszóval együtt.'; }
   catch { const field=document.createElement('textarea');field.value=command;field.style.position='fixed';field.style.opacity='0';document.body.appendChild(field);field.select();const ok=document.execCommand('copy');field.remove();status.textContent=ok?'Kimásolva a CS2 konzolparancs jelszóval együtt.':'Másold ki ezt a parancsot: '+command; }
 });
})();
</script></body></html>
