<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/">
<meta name="theme-color" content="#11131b">
<title>Beako Manager — CS2 szerverek</title>
<style>
:root{color-scheme:dark;--bg:#080f29;--panel:rgba(7,16,43,.84);--line:rgba(194,211,255,.42);--muted:#c0c9e6;--text:#f8f7ff;--accent:#a6a5ff;--green:#75f0bd;--red:#ff899b;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html{min-height:100%;background:#080f29}
body{margin:0;min-height:100vh;overflow-x:hidden;position:relative;background-color:var(--bg);background-image:linear-gradient(180deg,rgba(5,10,31,.10),rgba(5,10,31,.08) 55%,rgba(5,10,31,.24)),url("beako-christmas-bg.png");background-size:cover;background-position:center center;background-repeat:no-repeat;background-attachment:fixed;color:var(--text);padding:22px 16px 34px}
body:before{content:"";position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at 14% 39%,rgba(255,190,105,.18),transparent 21%),radial-gradient(ellipse at 15% 9%,rgba(255,220,125,.20),transparent 10%);animation:treeGlow 5.8s ease-in-out infinite alternate}
@keyframes treeGlow{0%{opacity:.42;filter:brightness(.85)}100%{opacity:1;filter:brightness(1.22)}}
.wrap{width:min(1400px,100%);margin:0 auto;position:relative;z-index:3}
.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 auto 0;max-width:1260px;min-height:58px;padding:0 8px}
.brand{font-size:11px;letter-spacing:.18em;font-weight:900;color:#f6d9a0;text-shadow:0 0 16px rgba(255,199,115,.45)}
.topnote{font-size:12px;color:var(--muted)}
h1{font-size:clamp(23px,3vw,30px);letter-spacing:-.04em;margin:4px 0 0;text-shadow:0 2px 20px #020719}
.header-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.skin{color:#f4efff;font-size:12px;font-weight:750;text-decoration:none;border:1px solid rgba(224,226,255,.38);background:rgba(12,20,49,.72);backdrop-filter:blur(12px);padding:10px 13px;border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.18);transition:transform .25s,border-color .25s,background .25s,box-shadow .25s}
.skin:hover{transform:translateY(-2px);border-color:#ffdca0;background:rgba(38,40,78,.88);box-shadow:0 0 22px rgba(255,205,128,.2)}
.discord-link{display:inline-flex;align-items:center;gap:8px}.discord-link svg{width:17px;height:17px;flex:none}
.servers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:34px;width:min(780px,70vw);margin:150px auto 0;align-items:stretch}
.server{min-width:0;min-height:300px;position:relative;overflow:visible;background:transparent;border:0;border-radius:0;padding:18px 16px 13px;box-shadow:none;backdrop-filter:none;-webkit-backdrop-filter:none;animation:cardEnter .8s cubic-bezier(.2,.75,.25,1) both;transition:transform .28s}
.server:nth-child(2){animation-delay:.13s}
.server:before{content:none}
.server:hover,.server:focus-within{transform:translateY(-1px)}
@keyframes cardEnter{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.server-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative}
.server h2{font-size:16px;margin:0;color:#fff7e9;text-shadow:0 1px 12px #020719}
.pill{font-size:9px;font-weight:900;letter-spacing:.09em;color:#e5eaff;background:rgba(89,111,180,.35);border:1px solid rgba(180,197,255,.42);border-radius:999px;padding:6px 8px;white-space:nowrap}
.address{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:#dce5ff;margin:8px 0 10px;position:relative}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.stat{padding:8px 10px;background:rgba(7,17,45,.88);border:1px solid rgba(175,195,255,.34);border-radius:9px;min-width:0;transition:background .2s,border-color .2s}
.server:hover .stat{background:rgba(12,27,63,.94);border-color:rgba(194,211,255,.48)}
.label{font-size:10px;color:#c4cde8;margin-bottom:4px}.value{font-size:14px;font-weight:850;overflow-wrap:anywhere}
.state-line{display:flex;align-items:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#9aa4c2;flex:none}.dot.online{background:var(--green);box-shadow:0 0 0 3px rgba(117,240,189,.12),0 0 13px #57d6a0aa;animation:onlinePulse 2.2s ease-in-out infinite}.dot.offline{background:var(--red);box-shadow:0 0 10px #ff7d8955}
@keyframes onlinePulse{50%{box-shadow:0 0 0 5px rgba(117,240,189,.04),0 0 18px #57d6a0}}
.map{position:relative;margin-top:9px;border:1px solid rgba(176,196,255,.34);border-radius:10px;overflow:hidden;background:rgba(7,17,45,.88)}
.map img{display:block;width:100%;height:83px;object-fit:contain;padding:4px;background:rgba(9,22,51,.92)}
.mapfoot{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-top:1px solid rgba(176,196,255,.24);background:rgba(7,17,45,.92)}
.mapname{font-size:12px;font-weight:850}.maplabel{font-size:9px;letter-spacing:.08em;color:#b9c7e9}
.actions{display:flex;gap:7px;margin-top:9px;position:relative}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 11px;border-radius:9px;border:1px solid transparent;font:750 11px inherit;text-decoration:none;cursor:pointer;transition:transform .18s,background .18s,border-color .18s,box-shadow .18s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(0) scale(.98)}
.join{background:linear-gradient(110deg,#7e8cff,#9d8eff);color:white;flex:1;box-shadow:0 5px 18px rgba(112,126,255,.25)}.join:hover{background:linear-gradient(110deg,#98a3ff,#b5a2ff);box-shadow:0 7px 22px rgba(135,143,255,.38)}
.copy{background:#1a2a50;color:#f3f5ff;border-color:rgba(203,216,255,.28)}.copy:hover{background:#263a68;border-color:rgba(230,232,255,.55)}
.bottom{margin:12px auto 0;width:min(850px,78vw);display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.error{color:#ffd0d5;font-size:11px;min-height:16px;text-shadow:0 1px 8px #000}.hidden{display:none!important}
.sign-hotspots{position:fixed;inset:0;z-index:7;pointer-events:none}
.sign-hotspot{position:absolute;display:block;pointer-events:auto;left:79.5%;width:20%;border-radius:22px;background:transparent;text-decoration:none;outline:none;cursor:pointer}
.sign-discord{top:37.5%;height:14.3%}
.sign-skin{top:54.3%;height:14.5%}
.sign-hotspot:focus-visible{outline:3px solid #ffe4a8;outline-offset:3px;background:rgba(255,230,170,.08)}
@media(max-width:720px){.sign-hotspots{display:none}}
.toast{position:fixed;left:50%;bottom:22px;z-index:20;transform:translate(-50%,16px);opacity:0;pointer-events:none;background:rgba(18,27,57,.94);border:1px solid rgba(197,211,255,.48);color:#fff;border-radius:11px;padding:12px 16px;font-size:13px;box-shadow:0 10px 40px #0008;transition:.22s;max-width:calc(100vw - 28px);text-align:center;backdrop-filter:blur(12px)}.toast.show{opacity:1;transform:translate(-50%,0)}
.snow-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none}.snow-back{z-index:2;opacity:.72}.snow-front{z-index:5;opacity:.92}.snowflake{position:absolute;top:-12vh;left:var(--x);width:var(--size);height:var(--size);border-radius:50%;background:rgba(244,249,255,.94);box-shadow:0 0 7px rgba(210,231,255,.62);opacity:var(--alpha);animation:snowFall var(--duration) linear var(--delay) infinite;will-change:transform}
.snow-back .snowflake{filter:blur(.45px)}.snow-front .snowflake{box-shadow:0 0 9px rgba(220,237,255,.72)}
@keyframes snowFall{0%{transform:translate3d(0,-12vh,0)}25%{transform:translate3d(22px,22vh,0)}50%{transform:translate3d(-13px,48vh,0)}75%{transform:translate3d(18px,74vh,0)}100%{transform:translate3d(-8px,112vh,0)}}
.single-server .servers{grid-template-columns:minmax(0,1fr);max-width:380px;width:min(380px,88vw);margin-top:150px;transform:none}.single-server .server{width:100%}.single-server .bottom{width:min(380px,88vw)}
@media(min-width:1500px){.servers{margin-top:150px}}
@media(max-width:900px){body{background-attachment:scroll}.servers{width:min(780px,88vw);gap:22px;margin-top:115px;transform:none}.bottom{width:min(780px,88vw)}}
@media(max-width:720px){body{padding:14px 11px 28px;background-position:34% top;background-size:auto 100vh;min-height:100vh}.top{align-items:flex-start;flex-direction:column;margin-bottom:0;padding:0 5px;gap:10px}.servers{grid-template-columns:1fr;width:min(390px,92vw);gap:12px;margin-top:74px}.server{min-height:0;padding:13px 15px}.map img{height:72px}.bottom{width:min(390px,92vw)}.single-server .servers{margin-top:74px}.sign-hotspots{display:none}.snow-front .snowflake:nth-child(n+14){display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;scroll-behavior:auto!important;transition:none!important}.snow-layer{display:none}}
</style>
</head>
<body>
<div class="snow-layer snow-back" id="snowBack" aria-hidden="true"></div>
<main class="wrap">
  <header class="top"><div><div class="brand">BEAKO MANAGER · CS2</div><h1>Szerverek</h1></div></header>
  <nav class="sign-hotspots" aria-label="Gyorshivatkozások a fatáblákon">
    <a class="sign-hotspot sign-discord" href="https://discord.gg/DZ4j5mnp6" target="_blank" rel="noopener noreferrer" aria-label="Discord meghívó" title="Discord meghívó"></a>
    <a class="sign-hotspot sign-skin" href="https://inventory.cstrike.app/" target="_blank" rel="noopener noreferrer" aria-label="Skin beállítás" title="Skin beállítás"></a>
  </nav>
  <div class="servers">
    <section class="server" id="mainCard" aria-labelledby="mainTitle">
      <div class="server-head"><h2 id="mainTitle">Fő szerver</h2><span class="pill">CS2 · FŐ</span></div>
      <p class="address" id="mainAddress">212.73.137.7:27914</p>
      <div class="stats"><div class="stat"><div class="label">Állapot</div><div class="state-line"><span class="dot" id="mainDot"></span><strong class="value" id="mainState">Betöltés…</strong></div></div><div class="stat"><div class="label">Játékosok</div><strong class="value" id="mainPlayers">— / 16</strong></div></div>
      <div class="map"><img id="mainMapImage" src="https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_mirage_radar_psd.png" alt="Fő szerver pályatérképe"><div class="mapfoot"><strong class="mapname" id="mainMapName">Pályaadatra vár</strong><span class="maplabel">AKTUÁLIS PÁLYA</span></div></div>
      <div class="actions"><a class="btn join" id="mainConnect" href="steam://connect/212.73.137.7:27914">Csatlakozás</a><button class="btn copy" id="mainCopy" type="button">Csatlakozási parancs másolása</button></div>
    </section>
    <section class="server" id="secondaryCard" aria-labelledby="secondaryTitle">
      <div class="server-head"><h2 id="secondaryTitle">Másodlagos szerver</h2><span class="pill">CS2 · 2. SZERVER</span></div>
      <p class="address" id="secondaryAddress">212.73.137.40:27381</p>
      <div class="stats"><div class="stat"><div class="label">Állapot</div><div class="state-line"><span class="dot" id="secondaryDot"></span><strong class="value" id="secondaryState">Betöltés…</strong></div></div><div class="stat"><div class="label">Játékosok</div><strong class="value" id="secondaryPlayers">— / 16</strong></div></div>
      <div class="map"><img id="secondaryMapImage" src="https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/de_nuke_radar_psd.png" alt="Másodlagos szerver pályatérképe"><div class="mapfoot"><strong class="mapname" id="secondaryMapName">Pályaadatra vár</strong><span class="maplabel">AKTUÁLIS PÁLYA</span></div></div>
      <div class="actions"><a class="btn join" id="secondaryConnect" href="steam://connect/212.73.137.40:27381">Csatlakozás</a><button class="btn copy" id="secondaryCopy" type="button">Csatlakozási parancs másolása</button></div>
    </section>
  </div>
  <div class="bottom"><div class="error" id="loadError" role="status" aria-live="polite"></div></div>
</main>
<div class="snow-layer snow-front" id="snowFront" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(() => {
  'use strict';
  // Lightweight CSS-driven snow: particles are created once and animated by transforms.
  function createSnow(layerId, count, sizeMin, sizeMax, durationMin, durationMax) {
    const layer = document.getElementById(layerId);
    if (!layer) return;
    const fragment = document.createDocumentFragment();
    for (let i = 0; i < count; i++) {
      const flake = document.createElement('i');
      flake.className = 'snowflake';
      flake.style.setProperty('--x', `${Math.random() * 100}%`);
      flake.style.setProperty('--size', `${sizeMin + Math.random() * (sizeMax - sizeMin)}px`);
      flake.style.setProperty('--duration', `${durationMin + Math.random() * (durationMax - durationMin)}s`);
      flake.style.setProperty('--delay', `${-Math.random() * durationMax}s`);
      flake.style.setProperty('--alpha', `${.35 + Math.random() * .6}`);
      fragment.appendChild(flake);
    }
    layer.appendChild(fragment);
  }
  createSnow('snowBack', 34, 2, 3.5, 13, 23);
  createSnow('snowFront', 20, 3, 5, 8, 16);
  // GitHub Pages serves these static folders as clean URLs.
  const route = window.location.pathname.replace(/\/+$/, '').toLowerCase();
  if (route === '/masodlagosszerver') {
    document.body.classList.add('single-server');
    const mainCard = document.getElementById('mainCard');
    if (mainCard) mainCard.hidden = true;
  } else if (route === '/foszerver') {
    document.body.classList.add('single-server');
    const secondaryCard = document.getElementById('secondaryCard');
    if (secondaryCard) secondaryCard.hidden = true;
  }

  const STATUS_URL = 'https://raw.githubusercontent.com/lambertbarath383-hub/beako-cs2-connect/live-status/status.json';
  const SERVERS = {
    main: { ip: '212.73.137.7', port: '27914', fallbackMap: 'de_mirage' },
    secondary: { ip: '212.73.137.40', port: '27381', fallbackMap: 'de_nuke' }
  };
  const MAPS = new Set(['de_mirage','de_nuke','de_dust2','de_inferno','de_ancient','de_anubis','de_overpass','de_vertigo','de_train','de_cache','de_cobblestone','de_mills','de_office','de_italy']);
  const byId = id => document.getElementById(id);
  const mapId = raw => {
    const value = String(raw || '').trim().toLowerCase();
    const normalized = value.startsWith('de_') ? value : `de_${value}`;
    return MAPS.has(normalized) ? normalized : '';
  };
  const mapTitle = raw => {
    const id = mapId(raw);
    return id ? id.slice(3).replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase()) : 'Pályaadatra vár';
  };
  const showToast = message => {
    const toast = byId('toast'); toast.textContent = message; toast.classList.add('show');
    window.setTimeout(() => toast.classList.remove('show'), 2200);
  };
  function setupServer(key, config) {
    const address = `${config.ip}:${config.port}`;
    const connect = byId(`${key}Connect`);
    connect.href = `steam://connect/${address}`;
    connect.addEventListener('click', () => {
      // Do not prevent navigation: the browser hands the URI to Steam.
    });

    // Copy a console-ready command; setting password first avoids a race with connect.
    byId(`${key}Copy`).addEventListener('click', async () => {
      const command = `connect ${address}`;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(command);
        } else {
          throw new Error('Clipboard API unavailable');
        }
        showToast('Csatlakozási parancs kimásolva. Illeszd be a CS2 konzoljába.');
      } catch (_) {
        const field = document.createElement('textarea');
        field.value = command;
        field.setAttribute('readonly', '');
        field.style.position = 'fixed';
        field.style.left = '-9999px';
        document.body.appendChild(field);
        field.focus(); field.select(); field.setSelectionRange(0, field.value.length);
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (_) {}
        field.remove();
        if (ok) showToast('Csatlakozási parancs kimásolva. Illeszd be a CS2 konzoljába.');
        else showToast('Másolás nem sikerült. Szerver címe: ' + address);
      }
    });
  }
  function renderServer(key, data) {
    const config = SERVERS[key];
    const busy = data && data.busy === true;
    const online = data && data.online === true;
    const count = Number(data && data.players);
    const max = Number(data && data.maxPlayers);
    byId(`${key}State`).textContent = busy ? 'Foglalt' : (online ? 'Online' : (data && data.online === false ? 'Offline' : 'Ismeretlen'));
    byId(`${key}Dot`).className = `dot ${busy ? 'offline' : (online ? 'online' : (data && data.online === false ? 'offline' : ''))}`;
    byId(`${key}Address`).classList.toggle('hidden', !!busy);
    byId(`${key}Connect`).classList.toggle('hidden', !!busy);
    byId(`${key}Copy`).classList.toggle('hidden', !!busy);
    byId(`${key}Players`).textContent = Number.isFinite(count) && count >= 0 ? `${Math.floor(count)} / ${Number.isFinite(max) && max > 0 ? Math.floor(max) : 16}` : `— / ${Number.isFinite(max) && max > 0 ? Math.floor(max) : 16}`;
    const selectedMap = mapId(data && data.map) || config.fallbackMap;
    byId(`${key}MapName`).textContent = mapTitle(data && data.map) !== 'Pályaadatra vár' ? mapTitle(data.map) : 'Pályaadatra vár';
    byId(`${key}MapImage`).src = `https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/${selectedMap}_radar_psd.png`;
    byId(`${key}MapImage`).onerror = () => {
      byId(`${key}MapImage`).onerror = null;
      byId(`${key}MapImage`).src = `https://raw.githubusercontent.com/MurkyYT/cs2-map-icons/main/images/radars/${config.fallbackMap}_radar_psd.png`;
    };
  }
  async function refreshStatus() {
    const error = byId('loadError');
    try {
      const response = await fetch(`${STATUS_URL}?v=${Date.now()}`, { cache: 'no-store' });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const status = await response.json();
      if (!status || typeof status !== 'object' || (!status.main && !status.secondary)) throw new Error('Hibás státuszfájl');
      renderServer('main', status.main || null);
      renderServer('secondary', status.secondary || null);
      error.textContent = '';
    } catch (_) {
      error.textContent = 'Az élő státusz átmenetileg nem érhető el.';
      // Keep the page and direct-connect buttons usable even when status fetching fails.
    }
  }
  Object.entries(SERVERS).forEach(([key, config]) => setupServer(key, config));
  refreshStatus();
  window.setInterval(refreshStatus, 15000);
})();
</script>
</body>
</html>
